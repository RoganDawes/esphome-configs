# define an incomplete template for temperature sensors
.sensor:
  - &common_temp
    platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Error Code"
    id: error_raw
    register_type: holding
    address: 34
    value_type: U_WORD
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Electronic Expansion Valve Position"
    id: eev_pos
    register_type: holding
    address: 69
    value_type: U_WORD
    unit_of_measurement: ""
    state_class: measurement
    entity_category: diagnostic

  - <<: *common_temp
    name: "Compressor Coil Temperature"
    id: coil_temp
    address: 70
    entity_category: diagnostic

  - <<: *common_temp
    name: "Ambient Temperature"
    id: ambient_temp
    address: 71

  - <<: *common_temp
    name: "Compressor Suction Temperature"
    id: compressor_suction_temp
    address: 72
    entity_category: diagnostic

  - <<: *common_temp
    name: "Compressor Outlet Temperature"
    id: compressor_outlet_temp
    address: 73
    entity_category: diagnostic

  - <<: *common_temp
    name: "Tank Temperature"
    id: tank_temp
    address: 74

  - <<: *common_temp
    name: "Outlet Water Temperature"
    id: outlet_temp
    address: 75
    entity_category: diagnostic

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Compressor run"
    id: compressor_run
    register_type: holding
    address: 76
    
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Fan run"
    id: fan_run
    register_type: holding
    address: 78
    entity_category: diagnostic
    
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Pump run"
    id: pump_run
    register_type: holding
    address: 80
    entity_category: diagnostic
    
switch:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
#    use_write_multiple: true
    name: "Power"
    id: power
    register_type: holding
    address: 774
    bitmask: 1

number:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    use_write_multiple: true
    register_type: holding
    value_type: U_WORD
    id: target_temp
    name: "Target Temp"
    address: 770
    min_value: 20
    max_value: 60
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature

text_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Status"
    id: status
    register_type: holding
    address: 33
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = modbus::helpers::word_from_hex_str(x, 0);
      switch (value) {
        case 65535: return std::string("Normal");
        case 5: return std::string("High Pressure");
        default: return std::string("Error " + x);
      }

