esp32:
  variant: esp32
  framework:
    type: esp-idf

uart:
  - id: uart_485
    baud_rate: 9600
    tx_pin: GPIO22
    rx_pin: GPIO21

modbus:
  - id: modbus_485
    uart_id: uart_485
    flow_control_pin: GPIO17


